name: grow_personal_dev
description: Personal development app (Habits, Journal, Todos, Finance, Timetable, Offline Chatbot)
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.3.3+2
  path: ^1.9.0
  uuid: ^4.5.2
  connectivity_plus: ^7.0.0
  google_generative_ai: ^0.4.6
  flutter_local_notifications: ^17.2.4
  intl: ^0.20.2
  image_picker: ^1.2.1
  timezone: ^0.9.4
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shared_preferences: ^2.5.5
  table_calendar: ^3.1.3
  permission_handler: ^11.4.0
  flutter_ringtone_player: ^4.0.0+4
  pedometer: ^4.0.2
  app_usage: ^4.1.0
  flutter_dotenv: ^5.2.1
  file_picker: ^8.1.4
  path_provider: ^2.1.4
  health: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/app_logo.jpg
    - .env


